<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="messages"></div>

  <div class="input-area">

  <script src="popup.js"></script>

</html>
